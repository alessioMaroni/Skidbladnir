[workspace]
resolver = "2"
members = [
    "skidbladnir-bootloader"
]

exclude = [

]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["The skidbladnir Kernel Project"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alessioMaroni/skidbladnir"

[workspace.dependencies]
uefi = "0.39.0"

[package]
name = "skidbladnir-kernel"
version = "0.1.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = " "
readme = "README.md"

[dependencies]
log = "0.4.34"

[features]

[profile.dev]
opt-level = 0
debug = 2
overflow-checks = true 
debug-assertions = true
lto = false
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false
strip = "symbols"
